<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Amir Store | متجر FC موبايل الاحترافي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a2e2a 0%, #0a1f1e 100%);
            color: #fff;
            direction: rtl;
            overflow-x: hidden;
        }
        
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #0d1f1e;
            border-bottom: 2px solid #f9c74f;
        }
        
        .top-bar {
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .lang-switch {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .lang-switch button {
            background: #1e3a3a;
            border: none;
            color: white;
            padding: 5px 10px;
            margin: 0 2px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: 0.3s;
        }
        .lang-switch button:hover {
            background: #2c5a57;
        }
        .lang-switch button.active {
            background: #f9c74f;
            color: #0a1f1e;
        }
        
        .top-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            align-items: center;
        }
        .top-actions button {
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .top-actions button:hover {
            transform: scale(0.95);
        }
        .share-main {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
        }
        
        .currency-nav-bar {
            background: linear-gradient(135deg, #1e3a3a, #0d2a2a);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid rgba(249,199,79,0.3);
        }
        .currency-select {
            background: #f9c74f;
            color: #0a1f1e;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            cursor: pointer;
            min-width: 140px;
            flex: 1;
            max-width: 100%;
        }
        
        .nav-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-btn {
            background: #2c5a57;
            color: #f9c74f;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .nav-btn:hover, .nav-btn:active {
            background: #f9c74f;
            color: #0a1f1e;
        }

        .header {
            text-align: center;
            padding: 12px 15px;
            background: rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 1.6em;
            color: #f9c74f;
        }

        .section-first, .section {
            margin: 20px 10px;
            scroll-margin-top: 130px;
        }
        .section-title {
            font-size: 1.2em;
            border-right: 4px solid #f9c74f;
            padding-right: 12px;
            margin-bottom: 15px;
            color: #f9c74f;
        }

        /* ===== متجاوب مع جميع الشاشات ===== */
        .products-grid {
            display: flex;
            flex-wrap: nowrap;
            gap: 18px;
            overflow-x: auto;
            padding: 10px 4px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .products-grid::-webkit-scrollbar {
            height: 6px;
        }
        .products-grid::-webkit-scrollbar-thumb {
            background: #f9c74f;
            border-radius: 10px;
        }
        
        .card {
            background: rgba(30, 58, 58, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 16px 14px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            border: 1px solid rgba(249, 199, 79, 0.3);
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            width: 300px;
            min-width: 280px;
            max-width: 100%;
            flex: 0 0 auto;
            scroll-snap-align: start;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            border-color: rgba(249,199,79,0.7);
        }
        
        /* تنسيق متجاوب للصور */
        .card-image-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 180px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            margin: 6px 0 12px;
            padding: 8px;
            overflow: hidden;
        }
        .card-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid rgba(249, 199, 79, 0.4);
            background: rgba(15, 35, 30, 0.5);
            transition: transform 0.3s ease;
        }
        .card:hover .card-image {
            transform: scale(1.05);
            border-color: #f9c74f;
        }
        
        .card.special-stars-card { 
            border-top: 4px solid #ffaa44; 
            background: linear-gradient(145deg, rgba(255,170,68,0.15), rgba(15,45,40,0.95)); 
        }
        .card.special-stars-card::before { 
            content: "🌟 معزز خاص"; 
            position: absolute; 
            top: -12px; 
            right: 16px; 
            background: #ffaa44; 
            color: #0a1f1e; 
            padding: 4px 14px; 
            border-radius: 30px; 
            font-size: 10px; 
            font-weight: bold; 
            z-index: 2; 
        }

        .card h3 {
            color: #f9c74f;
            margin: 8px 0;
            font-size: 1.1rem;
        }
        .offer-desc {
            font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 6px 10px;
            border-radius: 20px;
            color: #ffecb3;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .price-tag {
            font-size: 18px;
            font-weight: bold;
            margin: 6px 0 12px;
            color: #f9c74f;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 40px;
            align-self: center;
            width: 100%;
        }
        .btn-order {
            background: #f9844a;
            width: 100%;
            border: none;
            padding: 11px 10px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            color: #fff;
            transition: 0.2s;
        }
        .btn-order:hover { 
            background: #f96b2a; 
        }

        footer {
            background: #0d1f1e;
            margin-top: 30px;
            padding: 20px 12px;
            text-align: center;
        }
        .copyright {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #666;
        }

        /* تعديلات الشاشات الصغيرة (الموبايل) */
        @media (max-width: 768px) {
            .card {
                width: 260px;
                min-width: 250px;
                padding: 12px 10px;
            }
            .card-image-wrapper {
                height: 150px;
            }
            .card h3 {
                font-size: 1rem;
            }
            .price-tag {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <header class="sticky-header">
        <div class="top-bar">
            <div class="lang-switch">
                <button class="active">العربية</button>
                <button>English</button>
                <button>Türkçe</button>
            </div>
            <div class="top-actions">
                <button class="share-main">مشاركة المتجر 📲</button>
            </div>
        </div>
        <div class="currency-nav-bar">
            <select class="currency-select" id="currencySelect" onchange="changeCurrency()">
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="TRY">تركيا (₺)</option>
                <option value="SYP">سوريا (SYP)</option>
                <option value="ILS">فلسطين (₪)</option>
                <option value="JOD">الأردن (JOD)</option>
                <option value="IQD">العراق (IQD)</option>
                <option value="GCC">السعودية / الإمارات / قطر (ر.س/د.إ)</option>
                <option value="USDT">Binance (USDT)</option>
                <option value="ITUNES">آيتونز (iTunes)</option>
            </select>
            <nav class="nav-buttons">
                <a href="#special-stars" class="nav-btn">🌟 عروض خاصة</a>
            </nav>
        </div>
    </header>

    <div class="header">
        <h1>Amir Store ⚽</h1>
        <p>متجرك الموثوق لشحن FC Mobile بأسعار تنافسية</p>
    </div>

    <main>
        <!-- قسم العروض الخاصة وبطاقات النجوم -->
        <section id="special-stars" class="section-first">
            <h2 class="section-title">🌟 عروض خاصة - بطاقات النجوم وترقيات التصنيف</h2>
            <div class="products-grid">
                
                <!-- كارت منتج معزز يومي -->
                <div class="card special-stars-card" 
                     data-price-usd="6 $"
                     data-price-eur="5 €"
                     data-price-try="245.5 ₺"
                     data-price-syp="800 ل.س"
                     data-price-ils="21 ₪"
                     data-price-jod="4 JOD"
                     data-price-iqd="8,500 IQD"
                     data-price-gcc="20 ر.س/د.إ"
                     data-price-usdt="6 USDT"
                     data-price-itunes="6.25 $">
                    
                    <div class="card-image-wrapper">
                        <a href="https://imgbb.com/" target="_blank">
                            <img src="https://i.ibb.co/4nfR3GKT/Daily-booster-jpg.jpg" alt="معزز يومي" class="card-image" border="0">
                        </a>
                    </div>
                    <h3>معزز يومي</h3>
                    <div class="offer-desc">700 fc + درافت3 + 350 شارد</div>
                    <div class="price-tag" id="daily-booster-price">6 $</div>
                    <button class="btn-order" onclick="sendToWhatsApp(this)">اطلب عبر واتساب 💬</button>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>جميع الحقوق محفوظة &copy; 2026 Amir Store</p>
        </div>
        <div class="copyright">تصميم وتطوير متجر FC موبايل الاحترافي</div>
    </footer>

    <script>
        const phoneNumber = "905356387200";

        // دالة تغيير العملات تلقائياً
        function changeCurrency() {
            const selectedCurrency = document.getElementById('currencySelect').value;
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                const priceTag = card.querySelector('.price-tag');
                let newPrice = "";

                switch(selectedCurrency) {
                    case "EUR": newPrice = card.getAttribute('data-price-eur'); break;
                    case "TRY": newPrice = card.getAttribute('data-price-try'); break;
                    case "SYP": newPrice = card.getAttribute('data-price-syp'); break;
                    case "ILS": newPrice = card.getAttribute('data-price-ils'); break;
                    case "JOD": newPrice = card.getAttribute('data-price-jod'); break;
                    case "IQD": newPrice = card.getAttribute('data-price-iqd'); break;
                    case "GCC": newPrice = card.getAttribute('data-price-gcc'); break;
                    case "USDT": newPrice = card.getAttribute('data-price-usdt'); break;
                    case "ITUNES": newPrice = card.getAttribute('data-price-itunes'); break;
                    default: newPrice = card.getAttribute('data-price-usd'); break;
                }

                if(newPrice && priceTag) {
                    priceTag.innerText = newPrice;
                }
            });
        }

        // دالة إرسال الطلب عبر الواتساب
        function sendToWhatsApp(buttonElement) {
            const card = buttonElement.closest('.card');
            const productName = card.querySelector('h3').innerText;
            const productDesc = card.querySelector('.offer-desc').innerText;
            const productPrice = card.querySelector('.price-tag').innerText;
            
            const message = `مرحباً Amir Store 👋\nأرغب في شراء المنتج التالي:\n\n📌 *المنتج:* ${productName}\n📝 *المواصفات:* ${productDesc}\n💰 *السعر:* ${productPrice}\n\nيرجى تزويدي بتفاصيل الدفع للشراء.`;
            
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
